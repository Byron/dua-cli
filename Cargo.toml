[workspace]
members = ["crates/dua-lib"]
resolver = "3"

[workspace.package]
version = "2.42.0"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com"]
edition = "2024"
repository = "https://github.com/Byron/dua-cli"
license = "MIT"

[workspace.dependencies]
crossbeam = "0.8"
tempfile = "3.27.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
enum_glob_use = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
large_enum_variant = "allow"
missing_fields_in_debug = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
format_push_string = "allow"
fn_params_excessive_bools = "allow"

[package]
name = "dua-cli"
version = "2.44.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme = "README.md"
description = "A tool to conveniently learn about the disk usage of directories, fast!"
license.workspace = true
include = [
    "src/**/*",
    "Cargo.*",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "!**/tests/*",
]

[features]
default = ["tui-crossplatform", "trash-move"]
tui-crossplatform = [
    "crossterm",
    "dep:signal-hook",
    "tui",
    "open",
    "unicode-segmentation",
    "unicode-width",
]
trash-move = ["trash"]

[dependencies]
dua-core = { path = "crates/dua-lib", version = "3.3.0" }
clap = { version = "4.0.29", features = ["derive", "env"] }
clap_complete = "4.5.54"
byte-unit = { version = "5.2.5", features = ["u128"] }
itertools = "0.15.0"
num_cpus = "1.10.0"
anyhow = "1.0.31"
trash = { version = "5.2.0", optional = true, default-features = false, features = [
    "coinit_apartmentthreaded", "chrono"
] }
chrono = { version = "0.4.31", default-features = false, features = ["std"] }

# 'tui' related
unicode-segmentation = { version = "1.3.0", optional = true }
unicode-width = { version = "0.2.0", optional = true }
crossterm = { version = "0.29.0", optional = true }
tui = { package = "ratatui", version = "0.30.2", optional = true, default-features = false, features = [
    "crossterm",
] }
open = { version = "5.0", optional = true }
wild = "2.0.4"
owo-colors = "4.0.0"
human_format = "1.0.3"
gix = { version = "0.87.1", default-features = false, features = [
    "excludes",
    "sha1",
    "sha256",
] }
bstr = "1.8.0"
fern = "0.7.1"
jiff = "0.2.18"
log = "0.4.20"
log-panics = { version = "2", features = ["with-backtrace"] }
crossbeam.workspace = true
tempfile.workspace = true
toml = "1.1.4"
serde = { version = "1.0", features = ["derive"] }
dirs = "6"
shlex = "2.0.1"

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
filesize = "0.2.0"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3.18", optional = true }

[[bin]]
name = "dua"
path = "src/main.rs"

[lib]
name = "dua"

[profile.release]
panic = 'abort'
incremental = false
overflow-checks = false
lto = "fat"
#codegen-units = 1
build-override = { opt-level = 3 }

[dev-dependencies]
insta = "1.48.0"
pretty_assertions = "1.0.0"

[lints]
workspace = true
