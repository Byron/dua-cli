[package]
name = "dua-core"
version = "5.0.2"
authors.workspace = true
edition.workspace = true
repository.workspace = true
description = "Fast parallel filesystem traversal iterators"
license.workspace = true
rust-version = "1.88"

[package.metadata.smart-release]
api-check = ["cargo", "api-check", "release"]

[package.metadata.api-check]
profiles = [{ default-features = true, features = [] }]

[dependencies]
crossbeam.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.1", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
